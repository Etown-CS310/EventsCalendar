<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js" defer></script>
    <!-- My stylesheet -->
    <link href="css/calendar.css" rel="stylesheet" />
    <!-- JQuery JS -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- My calendar JS -->
    <script src="processes/calendarJS/calendar.js" defer></script>
</head>

<body>
    <header>
        <div class="" id="nav"><!-- match megans navbar structure --></div>
    </header>
    <main class="container-fluid">
        <div class="row">
            <div class="sidebar col-md-3" id="cal_side"> <!-- match megan's sidebar structure --></div>
            <div class="col-md-9" id="calendar"></div>
        </div>
    </main>
    <footer>
        <div class="" id="foot"><!-- Match idex footer --></div>
        <!-- Event Popout card -->
        <div id="eventCard" class="card">
            <div class="card-body">
                <button type="button" id="eventCardClose" class="btn-close float-end"></button>
                <h5 class="card-title" id="cardTitle"></h5>
                <p class="card-text" id="cardDate"></p>
                <p class="card-text" id="cardTime"></p>
                <p class="card-text" id="cardDesc"></p>
                <img id="cardPic" src="" alt="" class="img-fluid" style="display:none;">
            </div>
        </div>
        <!-- Event detail sidebar -->
        <div id="eventPanel" class="card">
            <div class="card-body">
                <button type="button" id="eventPanelClose" class="btn-close float-end"></button>
                <h5 class="card-title" id="panelTitle"></h5>
                <p class="card-text" id="panelDate"></p>
                <p class="card-text" id="panelTime"></p>
                <p class="card-text" id="panelDesc"></p>
                <img id="panelPic" src="" alt="" class="img-fluid" style="display:none;">
            </div>
        </div>
    </footer>

</body>

</html>
