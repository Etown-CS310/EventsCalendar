<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- navbar CSS -->
    <link href="css/navbar.css" rel="stylesheet" />
    <!-- Calendar CSS -->
    <link href="css/calendar.css" rel="stylesheet" />
    <!-- Calendar Redesign CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/calendar-design.css" rel="stylesheet" />

    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js" defer></script>
    <!-- JQuery JS -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous" defer></script>
    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Calendar JS -->
    <script src="processes/calendarJS/calendar.js" defer></script>
</head>

<body class="calendar-redesign">
    <header>
        <div id="navbar"></div>
    </header>
    <main class="container-fluid">
        <div class="row">
            <div class="sidebar col-md-3" id="cal_side">
                <h6 id="upcoming-events-header">Upcoming Events</h6>
                <div id="upcomingList"></div>

                <h6 class="mt-4">Categories</h6>
                <div id="legend"></div>

                <button type="button" class="btn btn-primary w-100 mb-3"
                    id="createEventBtn"
                    data-bs-toggle="modal"
                    data-bs-target="#createEventModal">
                    + Create Event
                </button>
            </div>
            <div class="col-md-9" id="calendar"></div>
        </div>
    </main>
    <footer>
        <div class="" id="foot"><!-- Match index footer --></div>
        <!-- Event Popout card -->
        <div id="eventCard" class="card">
            <div class="card-body">
                <button type="button" id="eventCardClose" class="btn-close float-end"></button>
                <h5 class="card-title" id="cardTitle"></h5>
                <p class="card-text" id="cardDate"></p>
                <p class="card-text" id="cardTime"></p>
                <p class="card-text" id="cardDesc"></p>
                <img id="cardPic" src="" alt="" class="img-fluid" style="display:none;">
            </div>
        </div>
    </footer>
    <!-- Create Event Modal -->
<div class="modal fade" id="createEventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Event</h5>
                <button type="button" class="btn-close"
                    data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="createEventForm">

                    <label class="form-label">Event Title</label>
                    <input type="text" class="form-control mb-3"
                        id="eventTitle" required>

                    <label class="form-label">Description</label>
                    <textarea class="form-control mb-3"
                        id="eventDescription"></textarea>

                    <label class="form-label">Start Date & Time</label>
                    <input type="datetime-local" class="form-control mb-3"
                        id="eventStart" required>

                    <label class="form-label">End Date & Time</label>
                    <input type="datetime-local" class="form-control mb-3"
                        id="eventEnd">

                    <label class="form-label">Location</label>
                    <input type="text" class="form-control mb-3"
                        id="eventLocation">

                    <label class="form-label">Category</label>
                    <select class="form-select mb-3" id="eventCategory" required>
                        <option value="">Select Category</option>
                        <option>OSA Activities</option>
                        <option>Weekender</option>
                        <option>Lectures</option>
                        <option>Traditions</option>
                        <option>Athletics</option>
                    </select>

                    <button type="submit" class="btn btn-primary w-100">
                        Save Event
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>

</body>

</html>
