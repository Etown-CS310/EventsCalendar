
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Events at Etown</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Our custom CSS -->
    <link rel="stylesheet" href="css/login.css">

    <!-- Our JavaScript -->
    <script src="processes/calendarJS/login.js" defer></script>
</head>

<body id="loginBody">

    <main class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="login-card">

            <!-- Website title -->
            <div class="text-center mb-4">
                <h1 class="site-title">Events at Etown</h1>
                <p class="text-muted">
                    Elizabethtown College Events Calendar
                </p>
            </div>

            <!-- Login heading -->
            <h2 class="login-heading">Welcome Back</h2>
            <p class="login-subtitle">
                Sign in to explore campus events
            </p>

            <!-- Login form -->
            <form id="loginForm" novalidate>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="off"
                            required
                        >

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <!-- Error or success messages -->
                <div
                    id="loginMessage"
                    class="alert d-none"
                    role="alert"
                    aria-live="polite"
                ></div>

                <!-- Login button -->
                <button
                    type="submit"
                    class="btn btn-primary w-100"
                    id="loginBtn"
                >
                    Log In
                </button>

            </form>

            <!-- Return to homepage -->
            <div class="text-center mt-4">
                <a href="index.html" class="home-link">
                    Back to Events
                </a>
            </div>

        </div>

    </main>

</body>
</html>
