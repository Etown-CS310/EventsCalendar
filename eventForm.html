<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- navbar CSS -->
    <link href="css/navbar.css" rel="stylesheet" />

    <!-- JQuery JS -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous" defer></script>
    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Create Event JS -->
    <script src="processes/createEventJS/create-event.js" defer></script>
</head>

<body>
    <header>
        <div id="navbar"></div>
    </header>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h2 class="mb-3">Create Event</h2>

                <div id="formAlert" class="alert d-none" role="alert"></div>

                <form id="eventForm" novalidate>
                    <div class="mb-3">
                        <label for="title" class="form-label">Event Title</label>
                        <input type="text" class="form-control" id="title" name="title" maxlength="100" required>
                        <div class="invalid-feedback">Please enter a title.</div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <label for="startDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="startDate" name="start_date" required>
                            <div class="invalid-feedback">Please choose a date.</div>
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label for="startTime" class="form-label">Time</label>
                            <input type="time" class="form-control" id="startTime" name="start_time" required>
                            <div class="invalid-feedback">Please choose a time.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="" selected disabled>Choose a category...</option>
                            <option>OSA Activities</option>
                            <option>Weekender</option>
                            <option>Lectures</option>
                            <option>Traditions</option>
                            <option>Athletics</option>
                        </select>
                        <div class="invalid-feedback">Please select a category.</div>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" maxlength="100"
                            placeholder="e.g. Bowers Lounge" required>
                        <div class="invalid-feedback">Please enter a location.</div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" maxlength="500"
                            required></textarea>
                        <div class="invalid-feedback">Please enter a description.</div>
                    </div>

                    <div class="mb-3">
                        <label for="picture" class="form-label">Picture (optional)</label>
                        <input type="file" class="form-control" id="picture" name="picture"
                            accept="image/png, image/jpeg, image/gif, image/webp">
                        <div class="form-text">PNG, JPG, GIF or WebP, up to 2 MB.</div>
                        <div class="invalid-feedback" id="pictureFeedback"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Submit Event</button>
                        <a href="calendar.html" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div id="foot"><!-- Match index footer --></div>
    </footer>
</body>

</html>
